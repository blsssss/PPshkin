      description: "Бесплатно и сразу удаляет профиль, дневник, согласия и состояние
        бота, отменяет активные брони с возвратом порций в горящие предложения и
        стирает объяснения показанных предложений. Повторный вызов тоже отвечает
        204. После удаления старый токен получает 404 user_not_found на GET
        /api/v1/me, новый вход создаёт пустой профиль без согласий. Коды ошибок:
        demo_account_protected (403): демо-учётка общая для всех проверяющих, её
        удалить нельзя."
