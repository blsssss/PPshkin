openapi: 3.1.0
info:
  title: PPshkin API
  version: 1.0.0
  description: HTTP API мини-приложения ППшкин в MAX. Гость ведёт дневник питания
    и получает персональные предложения заведений, заведение управляет меню,
    горящими позициями и бронями.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Сессионный токен из POST /api/v1/auth/max или тестовый токен
        демо-учётки (только при DEMO_MODE=true).
  schemas:
    GeoPointInput:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      required:
        - lat
        - lon
      description: Координаты WGS 84
    ProfilePatchInput:
      type: object
      properties:
        kcalTarget:
          type: integer
          minimum: 1000
          maximum: 5000
          description: Ориентир калорийности на день, ккал
        goal:
          anyOf:
            - type: string
              enum:
                - lose
                - maintain
                - gain
            - type: "null"
          description: "Цель: lose - снизить вес, maintain - удерживать, gain - набрать,
            null - не выбрана"
        dislikedTags:
          maxItems: 20
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
          description: Теги блюд, которые гостю не предлагаются
        timezone:
          description: Часовой пояс IANA, например Europe/Moscow
          type: string
          minLength: 1
          maxLength: 64
      description: "Изменение профиля: передаются только меняющиеся поля, хотя бы одно"
    BookingRequestInput:
      type: object
      properties:
        menuItemId:
          type: integer
          exclusiveMinimum: 0
          description: Позиция меню, которую гость бронирует
        dealId:
          description: "Горящее предложение на эту позицию: порция резервируется по цене
            предложения. Без dealId бронь по цене меню"
          type: integer
          exclusiveMinimum: 0
        offerId:
          description: "offerId из GET /api/v1/recommendations, если гость бронирует из
            подбора: предложение отмечается принятым, даже если гость раньше от
            него отказался"
          type: integer
          exclusiveMinimum: 0
      required:
        - menuItemId
      description: Что забронировать
    RedeemInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: "Код брони, который назвал гость, или value из
            WebApp.openCodeReader как есть: регистр и пробелы не важны,
            принимается и ppshkin:booking:<код>"
      required:
        - code
      description: Код брони для погашения
    ManualMealInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название блюда
        kcal:
          type: integer
          minimum: 0
          maximum: 5000
          description: Калорийность одним числом, вместо пары kcalMin и kcalMax
        kcalMin:
          type: integer
          minimum: 0
          maximum: 5000
          description: Нижняя граница калорийности, передаётся вместе с kcalMax
        kcalMax:
          type: integer
          minimum: 0
          maximum: 5000
          description: Верхняя граница калорийности, не меньше kcalMin
        proteinG:
          description: Белки, г
          type: number
          minimum: 0
          maximum: 500
        fatG:
          description: Жиры, г
          type: number
          minimum: 0
          maximum: 500
        carbsG:
          description: Углеводы, г
          type: number
          minimum: 0
          maximum: 500
        tags:
          maxItems: 10
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        eatenAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: "Когда съедено, ISO 8601: не раньше чем 7 дней назад и не позже чем
            через 5 минут от текущего времени"
      required:
        - title
      description: "Приём пищи, введённый вручную. Калорийность: либо kcal, либо пара
        kcalMin и kcalMax. Без eatenAt запись получает текущее время"
    MealPatchInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название блюда
        kcal:
          type: integer
          minimum: 0
          maximum: 5000
          description: Калорийность одним числом, вместо пары kcalMin и kcalMax
        kcalMin:
          type: integer
          minimum: 0
          maximum: 5000
          description: Нижняя граница калорийности, передаётся вместе с kcalMax
        kcalMax:
          type: integer
          minimum: 0
          maximum: 5000
          description: Верхняя граница калорийности, не меньше kcalMin
        proteinG:
          description: Белки, г, null сбрасывает значение
          anyOf:
            - type: number
              minimum: 0
              maximum: 500
            - type: "null"
        fatG:
          description: Жиры, г, null сбрасывает значение
          anyOf:
            - type: number
              minimum: 0
              maximum: 500
            - type: "null"
        carbsG:
          description: Углеводы, г, null сбрасывает значение
          anyOf:
            - type: number
              minimum: 0
              maximum: 500
            - type: "null"
        tags:
          maxItems: 10
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        eatenAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: "Когда съедено, ISO 8601: не раньше чем 7 дней назад и не позже чем
            через 5 минут от текущего времени"
      description: "Изменение приёма пищи: только меняющиеся поля, хотя бы одно.
        Калорийность: либо kcal, либо пара kcalMin и kcalMax"
    BodyParametersInput:
      type: object
      properties:
        sex:
          type: string
          enum:
            - female
            - male
          description: female - женский, male - мужской
        ageYears:
          type: integer
          minimum: 14
          maximum: 100
          description: Возраст, полных лет
        heightCm:
          type: integer
          minimum: 120
          maximum: 230
          description: Рост, см
        weightKg:
          type: number
          minimum: 35
          maximum: 250
          multipleOf: 0.1
          description: Вес, кг, не больше одного знака после запятой
        activity:
          type: string
          enum:
            - sedentary
            - light
            - moderate
            - active
          description: sedentary - сидячий образ жизни; light - тренировки 1-3 раза в
            неделю; moderate - 3-5 раз; active - 6-7 раз
        goal:
          type: string
          enum:
            - lose
            - maintain
            - gain
          description: lose - снизить вес, maintain - удерживать, gain - набрать
      required:
        - sex
        - ageYears
        - heightCm
        - weightKg
        - activity
        - goal
      description: Параметры тела и цель для расчёта ориентира калорийности
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Машиночитаемый код ошибки
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
      additionalProperties: false
      description: Описание ошибки по RFC 9457
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      required:
        - lat
        - lon
      additionalProperties: false
      description: Координаты WGS 84
    ConsentState:
      type: object
      properties:
        granted:
          type: boolean
          description: true, только если действует согласие на актуальную версию текста
        version:
          description: Версия действующего согласия, null если согласия нет. Устаревшая
            версия означает, что согласие нужно дать заново
          type:
            - string
            - "null"
        grantedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
          description: Когда дано действующее согласие
      required:
        - granted
        - version
        - grantedAt
      additionalProperties: false
      description: Состояние согласия пользователя
    ConsentStatus:
      type: object
      properties:
        personalData:
          $ref: "#/components/schemas/ConsentState"
        personalizedOffers:
          $ref: "#/components/schemas/ConsentState"
      required:
        - personalData
        - personalizedOffers
      additionalProperties: false
      description: Состояние обоих согласий пользователя
    ConsentDocument:
      type: object
      properties:
        kind:
          type: string
          enum:
            - personal_data
            - personalized_offers
          description: personal_data - обработка персональных данных, personalized_offers
            - персональные предложения
        version:
          type: string
          description: Актуальная версия текста, её передают в PUT /api/v1/consents/{kind}
        title:
          type: string
        text:
          type: string
          description: Полный текст согласия, абзацы разделены пустой строкой
        required:
          type: boolean
          description: Без обязательного согласия дневник и профиль не сохраняются
        granted:
          type: boolean
          description: Действует ли согласие пользователя на актуальную версию
        grantedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
          description: Когда дано действующее согласие
      required:
        - kind
        - version
        - title
        - text
        - required
        - granted
        - grantedAt
      additionalProperties: false
      description: Текст согласия и его состояние у пользователя
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор пользователя в MAX
        firstName:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        timezone:
          type: string
          description: Часовой пояс IANA, по нему считаются дни дневника
        kcalTarget:
          type: integer
          description: Ориентир калорийности на день, ккал
        goal:
          anyOf:
            - type: string
              enum:
                - lose
                - maintain
                - gain
            - type: "null"
          description: "Цель: lose - снизить вес, maintain - удерживать, gain - набрать,
            null - не выбрана"
        dislikedTags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
          description: Теги блюд, которые гостю не предлагаются
        location:
          anyOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
          description: Последнее переданное местоположение с точностью около 1 км
        locationUpdatedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
          description: Когда передано местоположение
        consents:
          $ref: "#/components/schemas/ConsentStatus"
      required:
        - id
        - firstName
        - username
        - timezone
        - kcalTarget
        - goal
        - dislikedTags
        - location
        - locationUpdatedAt
        - consents
      additionalProperties: false
      description: Профиль пользователя и состояние его согласий
    UserLocation:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/GeoPoint"
        updatedAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
      required:
        - location
        - updatedAt
      additionalProperties: false
      description: "Сохранённое местоположение: координаты округлены до 2 знаков, это
        около 1 км"
    Session:
      type: object
      properties:
        token:
          type: string
          description: "Токен для заголовка Authorization: Bearer"
        expiresAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
        startParam:
          description: Подписанный параметр startapp, с которым открыто мини-приложение
          type:
            - string
            - "null"
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - expiresAt
        - startParam
        - user
      additionalProperties: false
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type:
            - string
            - "null"
        category:
          type: string
          enum:
            - breakfast
            - main
            - soup
            - salad
            - side
            - bakery
            - dessert
            - snack
            - drink
        priceRub:
          type: integer
          description: Цена в рублях
        weightG:
          anyOf:
            - type: integer
            - type: "null"
          description: Выход порции в граммах
        kcal:
          type: integer
          description: Калорийность порции
        proteinG:
          anyOf:
            - type: number
              description: Граммы на порцию
            - type: "null"
        fatG:
          anyOf:
            - type: number
              description: Граммы на порцию
            - type: "null"
        carbsG:
          anyOf:
            - type: number
              description: Граммы на порцию
            - type: "null"
        nutritionSource:
          type: string
          enum:
            - venue
            - estimate
          description: venue - калорийность указало заведение, estimate - оценка при
            распознавании меню
        tags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        isAvailable:
          type: boolean
          description: false - позиция скрыта от гостей, но остаётся в меню заведения
      required:
        - id
        - name
        - description
        - category
        - priceRub
        - weightG
        - kcal
        - proteinG
        - fatG
        - carbsG
        - nutritionSource
        - tags
        - isAvailable
      additionalProperties: false
      description: Позиция меню заведения
    ParsedMenuItem:
      type: object
      properties:
        name:
          type: string
        description:
          type:
            - string
            - "null"
        category:
          type: string
          enum:
            - breakfast
            - main
            - soup
            - salad
            - side
            - bakery
            - dessert
            - snack
            - drink
        priceRub:
          anyOf:
            - type: integer
            - type: "null"
          description: "Цена из меню; null, если её нет в меню: владелец указывает цену
            перед применением"
        weightG:
          anyOf:
            - type: integer
            - type: "null"
        kcal:
          type: integer
          description: Оценка калорийности порции
        proteinG:
          type: number
          description: Граммы на порцию
        fatG:
          type: number
          description: Граммы на порцию
        carbsG:
          type: number
          description: Граммы на порцию
        tags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
      required:
        - name
        - description
        - category
        - priceRub
        - weightG
        - kcal
        - proteinG
        - fatG
        - carbsG
        - tags
      additionalProperties: false
      description: Позиция, распознанная в меню. Калорийность и БЖУ оценочные,
        владелец может их исправить
    MenuImport:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
          enum:
            - photo
            - text
        status:
          type: string
          enum:
            - processing
            - ready
            - failed
            - applied
          description: processing - распознаётся, опрашивайте раз в 2 секунды; ready -
            проверьте позиции и примените; failed - покажите error; applied -
            позиции уже в меню
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParsedMenuItem"
        error:
          description: Причина неудачи для показа владельцу как есть
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
        completedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
      required:
        - id
        - source
        - status
        - items
        - error
        - createdAt
        - completedAt
      additionalProperties: false
      description: Импорт меню по фото или тексту
    Deal:
      type: object
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        itemName:
          type: string
        priceRub:
          type: integer
          description: Цена по акции в рублях
        originalPriceRub:
          type: integer
          description: Текущая цена позиции в меню
        discountPercent:
          type: integer
          description: Скидка в процентах от цены в меню
        quantityTotal:
          type: integer
        quantityLeft:
          type: integer
        startsAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
        endsAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
        status:
          type: string
          enum:
            - scheduled
            - active
            - sold_out
            - ended
            - cancelled
