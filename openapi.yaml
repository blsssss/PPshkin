openapi: 3.1.0
info:
  title: PPshkin API
  version: 1.0.0
  description: HTTP API мини-приложения ППшкин в MAX. Гость ведёт дневник питания
    и получает персональные предложения заведений, заведение управляет меню,
    горящими позициями и бронями.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Сессионный токен из POST /api/v1/auth/max или тестовый токен
        демо-учётки (только при DEMO_MODE=true).
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Machine readable error code
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
      additionalProperties: false
      description: RFC 9457 problem details
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      required:
        - lat
        - lon
      additionalProperties: false
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          description: MAX user id
        firstName:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        timezone:
          type: string
        kcalTarget:
          type: integer
          description: Daily calorie guideline
        goal:
          anyOf:
            - type: string
              enum:
                - lose
                - maintain
                - gain
            - type: "null"
        dislikedTags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        location:
          anyOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
          description: Last shared location, rounded to about 1 km
      required:
        - id
        - firstName
        - username
        - timezone
        - kcalTarget
        - goal
        - dislikedTags
        - location
      additionalProperties: false
    Session:
      type: object
      properties:
        token:
          type: string
          description: Bearer token for the Authorization header
        expiresAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: ISO 8601 date and time
        startParam:
          description: Signed startapp parameter the mini app was opened with
          type:
            - string
            - "null"
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - expiresAt
        - startParam
        - user
      additionalProperties: false
paths:
  /health:
    get:
      summary: Liveness probe
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
  /ready:
    get:
      summary: Readiness probe, checks the database
      tags:
        - system
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                required:
                  - status
                additionalProperties: false
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/max:
    post:
      summary: Exchange MAX mini app init data for a session token
      tags:
        - auth
      description: Проверяет подпись initData по алгоритму MAX (HMAC-SHA256 с ключом
        WebAppData и токеном бота) и срок давности, создаёт пользователя при
        первом входе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initData:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: Raw window.WebApp.initData string from MAX Bridge, sent as is
              required:
                - initData
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      summary: Current user profile
      tags:
        - me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
servers:
  - url: http://localhost:3000
tags:
  - name: system
    description: Состояние сервиса
  - name: auth
    description: Вход через MAX
  - name: me
    description: Профиль текущего пользователя
