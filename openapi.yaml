  /api/v1/bookings:
    post:
      operationId: createBooking
      summary: Забронировать блюдо
      tags:
        - bookings
      description: "Резервирует порцию в открытом заведении и выдаёт код из 6 символов
        и QR. Гость показывает код или QR на кассе, заведение гасит бронь, блюдо
        попадает в дневник гостя. Бронь действует 60 минут, но не дольше конца
        горящего предложения и не дольше закрытия заведения: точное время в
        expiresAt. С dealId одна порция предложения резервируется за гостем по
        цене предложения и возвращается в продажу при отмене или истечении
        брони. Без dealId бронь по цене меню. С offerId предложение из подбора
        отмечается принятым, даже если гость раньше от него отказался. У гостя
        может быть не больше 3 активных броней и одна активная бронь на позицию.
        Цена и калорийность фиксируются на момент бронирования. Коды ошибок:
        validation_failed (400): исправьте поля, перечисленные в errors.
        consent_required (403): нет согласия на обработку данных, покажите его
        текст из GET /api/v1/consents и отправьте PUT
        /api/v1/consents/personal_data. user_not_found (404): аккаунт удалён,
        войдите заново. menu_item_not_found (404): позиция убрана из меню или не
        существует, обновите карточку заведения. deal_not_found (404): горящего
        предложения нет или оно на другую позицию. offer_not_found (404):
        предложение показано другому гостю или на другую позицию, бронируйте без
        offerId. venue_closed (409): заведение сейчас закрыто, покажите часы
        работы. deal_not_active (409): горящее предложение снято, закончилось
        или ещё не началось, предложите бронь по цене меню без dealId.
        booking_exists (409): у гостя уже есть активная бронь этой позиции,
        откройте её из GET /api/v1/bookings. deal_sold_out (409): порции по
        предложению закончились, предложите бронь по цене меню без dealId.
        too_many_bookings (409): уже 3 активные брони, отмените одну из них или
        дождитесь, пока заведение её погасит. menu_item_unavailable (422):
        заведение скрыло позицию от гостей."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequestInput"
      security: *a3
      responses:
        "201":
          description: Бронь создана
          content:
            application/json:
              schema:
