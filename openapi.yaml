      properties:
        offerId:
          type: integer
          description: Идентификатор показа, по нему гость отказывается через POST
            /api/v1/offers/{id}/decline
        headline:
          type: string
          description: Заголовок карточки, например «Можно позволить десерт»
        facts:
          type: array
          items:
            type: string
          description: Факты из дневника и о блюде
        calculations:
          type: array
          items:
            type: string
          description: "Расчёты: остаток до ориентира, путь до заведения, скидка"
        assumptions:
          type: array
          items:
            type: string
          description: Допущения и оговорки, в том числе о приблизительной калорийности
        score:
          type: number
          description: Оценка соответствия, по ней отсортированы предложения
        item:
          $ref: "#/components/schemas/MenuItem"
        venue:
          $ref: "#/components/schemas/Venue"
        deal:
          anyOf:
            - $ref: "#/components/schemas/Deal"
            - type: "null"
          description: Горящее предложение на эту позицию или null
        distanceM:
          anyOf:
            - type: integer
            - type: "null"
          description: Расстояние до заведения в метрах; null, если точка неизвестна
        priceRub:
          type: integer
          description: Цена с учётом горящего предложения
        kcal:
          type: integer
          description: Калорийность позиции
      required:
        - offerId
        - headline
        - facts
        - calculations
        - assumptions
        - score
        - item
        - venue
        - deal
        - distanceM
        - priceRub
        - kcal
      additionalProperties: false
      description: Конкретное блюдо в конкретном заведении и объяснение, почему оно подходит
    Recommendations:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - budget_exhausted
            - nothing_fits
            - profile_empty
          description: ok - есть предложения; profile_empty - за 14 дней нет записей в
            дневнике; budget_exhausted - ориентир на сегодня набран;
            nothing_fits - рядом нет подходящих открытых позиций
        slot:
          type: string
          enum:
            - breakfast
            - lunch
            - snack
            - dinner
          description: Приём пищи сейчас по местному времени пользователя
        remainingKcal:
          type: integer
          description: Сколько осталось до ориентира на сегодня, не меньше 0
        slotBudgetKcal:
          type: integer
          description: Разумная калорийность для этого приёма пищи
        demoCenterUsed:
          type: boolean
          description: "Демо-режим: точка поиска дальше 50 км от Казани, поэтому
            расстояния и радиус считаются от центра Казани (ул. Баумана).
            Покажите это гостю. Вне демо-режима всегда false"
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationItem"
          description: Предложения от лучшего к худшему, разные заведения идут первыми;
            пусто, если status не ok
      required:
        - status
        - slot
        - remainingKcal
        - slotBudgetKcal
        - demoCenterUsed
        - items
      additionalProperties: false
      description: Подбор блюд рядом под остаток калорий и вкусы гостя
    VenueTopItem:
      type: object
      properties:
        menuItemId:
          type: integer
        name:
          type: string
          description: Текущее название позиции
        redeemed:
          type: integer
          description: Сколько броней погашено
        revenueRub:
          type: integer
          description: Выручка по погашенным броням
      required:
        - menuItemId
        - name
        - redeemed
        - revenueRub
      additionalProperties: false
      description: Позиция среди самых продаваемых через брони
    VenueAnalyticsDay:
      type: object
      properties:
        date:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          examples:
            - 2026-09-25
        offersShown:
          type: integer
        offersAccepted:
          type: integer
        bookingsCreated:
          type: integer
        bookingsRedeemed:
          type: integer
        revenueRub:
          type: integer
          description: Рубли
      required:
        - date
        - offersShown
        - offersAccepted
        - bookingsCreated
        - bookingsRedeemed
        - revenueRub
      additionalProperties: false
      description: Показатели за один день по часовому поясу заведения
    VenueAnalytics:
      type: object
      properties:
        from:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          examples:
            - 2026-09-25
        to:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          examples:
            - 2026-09-25
        timezone:
          type: string
          description: Часовой пояс заведения, по которому считаются дни
        offersShown:
          type: integer
          description: Сколько раз гостям предложили позиции заведения
        offersAccepted:
          type: integer
          description: Сколько из этих предложений гости забронировали
        bookingsCreated:
          type: integer
          description: Сколько броней создано
        bookingsRedeemed:
          type: integer
          description: Сколько из них погашено
        bookingsExpired:
          type: integer
          description: Сколько из них истекло
        bookingsCancelled:
          type: integer
          description: Сколько из них отменили гости
        acceptRate:
          type: number
          description: offersAccepted / offersShown, до сотых; 0, если предложений не было
        redeemRate:
          type: number
          description: bookingsRedeemed / bookingsCreated, до сотых; 0, если броней не было
        revenueRub:
          type: integer
          description: Выручка по погашенным броням
        surplusUnitsSold:
          type: integer
          description: Сколько порций горящих предложений продано вместо списания
        surplusRevenueRub:
          type: integer
          description: Выручка с этих порций
        topItems:
          type: array
          items:
            $ref: "#/components/schemas/VenueTopItem"
          description: До 5 позиций с наибольшим числом погашенных броней
        byDay:
          type: array
          items:
            $ref: "#/components/schemas/VenueAnalyticsDay"
          description: Каждый день периода, включая дни без событий, от старых к новым
      required:
        - from
        - to
        - timezone
        - offersShown
        - offersAccepted
        - bookingsCreated
        - bookingsRedeemed
        - bookingsExpired
        - bookingsCancelled
        - acceptRate
        - redeemRate
        - revenueRub
        - surplusUnitsSold
        - surplusRevenueRub
        - topItems
        - byDay
      additionalProperties: false
      description: Итоги заведения за период. Предложения и брони относятся к дню, в
        который они созданы. Данных гостей в ответе нет
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка, что процесс жив
      tags:
        - system
      responses:
        "200":
          description: Процесс работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /ready:
    get:
      operationId: getReadiness
      summary: Готовность к работе, проверяет базу данных
      tags:
        - system
      responses:
        "200":
          description: Сервис готов
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                required:
                  - status
                additionalProperties: false
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: &a1
            Retry-After:
              description: Через сколько секунд можно повторить запрос
              schema:
                type: integer
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/max:
    post:
      operationId: signInWithMax
      summary: Вход по initData мини-приложения MAX
      tags:
        - auth
      description: "Проверяет подпись initData по алгоритму MAX (HMAC-SHA256 с ключом
        WebAppData и токеном бота) и срок давности, создаёт пользователя при
        первом входе и выдаёт сессионный токен. Коды ошибок:
        init_data_malformed, init_data_bad_signature, init_data_no_user (401,
        отправьте initData без изменений), init_data_expired (401, переоткройте
        мини-приложение), auth_unavailable (503, вход через MAX не настроен на
        сервере). Токен из ответа передаётся в заголовке Authorization: Bearer.
        Ответ 401 с кодом invalid_token на других методах означает, что сессия
        истекла и нужно войти заново. В user.consents состояние согласий: если
        personalData.granted равно false, покажите экраны согласий до работы с
        дневником."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initData:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: Строка window.WebApp.initData из MAX Bridge без изменений
              required:
                - initData
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: &a2
            WWW-Authenticate:
              description: Схема аутентификации Bearer
              schema:
                type: string
        "413":
          description: Payload Too Large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Профиль текущего пользователя
      tags:
        - me
      description: "Профиль вместе с состоянием согласий: по consents мини-приложение
        решает, показывать ли экраны согласий. Коды ошибок: user_not_found
        (404): аккаунт удалён, войдите заново."
      security: &a3
        - bearerAuth: []
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateMe
      summary: Изменить профиль
      tags:
        - me
      description: "Меняет только переданные поля: ориентир калорийности, цель,
        нелюбимые теги, часовой пояс. Повторы тегов удаляются. Коды ошибок:
        validation_failed (400): исправьте поля, перечисленные в errors.
        consent_required (403): нет согласия на обработку данных, покажите его
        текст из GET /api/v1/consents и отправьте PUT
        /api/v1/consents/personal_data. user_not_found (404): аккаунт удалён,
        войдите заново. invalid_timezone (422): часовой пояс не найден,
        передайте имя IANA, например Europe/Moscow."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatchInput"
      security: *a3
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteMyAccount
      summary: Удалить аккаунт и все данные
      tags:
        - me
      description: "Бесплатно и сразу удаляет профиль, дневник, согласия и состояние
        бота, отменяет активные брони с возвратом порций в горящие предложения и
        стирает объяснения показанных предложений. Копия тестового заведения из
        демо-режима удаляется вместе с меню, акциями и бронями. Повторный вызов
        тоже отвечает 204. После удаления старый токен получает 404
        user_not_found на GET /api/v1/me, новый вход создаёт пустой профиль без
        согласий. Коды ошибок: demo_account_protected (403): демо-учётка общая
        для всех проверяющих, её удалить нельзя."
      security: *a3
      responses:
        "204":
          description: Аккаунт удалён
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me/location:
    put:
      operationId: setMyLocation
      summary: Сохранить местоположение
      tags:
        - me
      description: "Координаты округляются до 2 знаков (около 1 км) и сохраняются
        только в таком виде, по ним подбираются заведения рядом. Коды ошибок:
        validation_failed (400): исправьте поля, перечисленные в errors.
        consent_required (403): нет согласия на обработку данных, покажите его
        текст из GET /api/v1/consents и отправьте PUT
        /api/v1/consents/personal_data. user_not_found (404): аккаунт удалён,
        войдите заново."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoPointInput"
      security: *a3
      responses:
        "200":
          description: Сохранённое местоположение
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLocation"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: clearMyLocation
      summary: Удалить местоположение
      tags:
        - me
      description: Работает без согласия на обработку данных. Повторный вызов тоже
        отвечает 204.
      security: *a3
      responses:
        "204":
          description: Местоположение удалено
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/consents:
    get:
      operationId: listConsents
      summary: Тексты согласий и их состояние
      tags:
        - consents
      description: Возвращает personal_data (обязательное, без него дневник и профиль
        не сохраняются) и personalized_offers (необязательное). Каждое согласие
        показывается отдельным экраном с полным текстом и своей кнопкой, после
        нажатия отправьте PUT /api/v1/consents/{kind} с version из ответа.
      security: *a3
      responses:
        "200":
          description: Согласия в порядке показа
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentDocument"
                required:
                  - items
                additionalProperties: false
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/consents/{kind}:
    put:
      operationId: grantConsent
      summary: Дать согласие
      tags:
        - consents
      description: "Сохраняет согласие с версией текста, каналом miniapp и временем,
        предыдущая запись остаётся в истории. Повтор с той же версией ничего не
        меняет. Коды ошибок: validation_failed (400): исправьте поля,
        перечисленные в errors. user_not_found (404): аккаунт удалён, войдите
        заново. consent_version_outdated (409): текст изменился, загрузите GET
        /api/v1/consents и покажите его заново."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Версия текста, который увидел пользователь, из GET /api/v1/consents
              required:
                - version
      parameters:
        - schema:
            type: string
            enum:
              - personal_data
              - personalized_offers
          in: path
          name: kind
          required: true
          description: personal_data - обработка персональных данных, personalized_offers
            - персональные предложения
      security: *a3
      responses:
        "200":
          description: Состояние согласия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "404":
          description: Not Found
          content:
