  /api/v1/consents/{kind}:
    put:
      operationId: grantConsent
      summary: Дать согласие
      tags:
        - consents
      description: "Сохраняет согласие с версией текста, каналом miniapp и временем,
        предыдущая запись остаётся в истории. Повтор с той же версией ничего не
        меняет. Коды ошибок: validation_failed (400): исправьте поля,
        перечисленные в errors. user_not_found (404): аккаунт удалён, войдите
        заново. consent_version_outdated (409): текст изменился, загрузите GET
        /api/v1/consents и покажите его заново."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  minLength: 1
                  maxLength: 32
                  description: Версия текста, который увидел пользователь, из GET /api/v1/consents
              required:
                - version
      parameters:
        - schema:
            type: string
            enum:
              - personal_data
              - personalized_offers
          in: path
          name: kind
          required: true
          description: personal_data - обработка персональных данных, personalized_offers
            - персональные предложения
      security: *a3
      responses:
        "200":
          description: Состояние согласия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentState"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: revokeConsent
      summary: Отозвать согласие
      tags:
        - consents
      description: "Сразу отзывает согласие на персональные предложения, повторный
        вызов тоже отвечает 204. Коды ошибок: validation_failed (400): исправьте
        поля, перечисленные в errors. delete_account_instead (409): согласие на
        обработку данных отзывается только удалением аккаунта, покажите «Чтобы
        отозвать согласие на обработку данных, удалите аккаунт» и предложите
        DELETE /api/v1/me."
      parameters:
        - schema:
            type: string
            enum:
              - personal_data
              - personalized_offers
          in: path
          name: kind
          required: true
          description: personal_data - обработка персональных данных, personalized_offers
            - персональные предложения
      security: *a3
      responses:
        "204":
          description: Согласие отозвано
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
