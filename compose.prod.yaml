name: ppshkin-prod

x-logging: &logging
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  backend:
    image: ghcr.io/blsssss/ppshkin-backend:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 1
      PUBLIC_BASE_URL: https://${DOMAIN:?задайте DOMAIN в .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-ppshkin}@db:5432/${POSTGRES_DB:-ppshkin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BOT_MODE: ${BOT_MODE:-webhook}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ghcr.io/blsssss/ppshkin-frontend:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppshkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-ppshkin}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
