    post:
      operationId: createDeal
      summary: Выставить горящее предложение
      tags:
        - venue
      description: "Позиция продаётся со скидкой с текущего момента до endsAt, не
        дольше 24 часов. Если владелец выбирает скидку в процентах, цену считает
        клиент: round(цена позиции * (1 - процент / 100)). Коды ошибок:
        menu_item_not_found (404, позиция удалена или принадлежит другому
        заведению), menu_item_unavailable (422, позиция скрыта от гостей,
        сначала включите её), deal_price_not_lower (422, цена предложения должна
        быть ниже цены в меню), deal_window_invalid (422, выберите окончание в
        ближайшие 24 часа), deal_exists (409, на позицию уже есть горящее
        предложение, измените или снимите его), venue_not_found (404, заведения
        ещё нет, предложите создать его через POST /api/v1/venue),
        validation_failed (400, исправьте поля из errors)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                menuItemId:
                  type: integer
                  exclusiveMinimum: 0
                priceRub:
                  type: integer
                  minimum: 1
                  maximum: 100000
                  description: Цена по акции в рублях, строго ниже цены позиции в меню
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Сколько порций продаётся по акции
                endsAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  description: "Окончание акции, ISO 8601: позже текущего момента и не позже чем
                    через 24 часа"
              required:
