name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ppshkin
          POSTGRES_PASSWORD: ppshkin
          POSTGRES_DB: ppshkin_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ppshkin -d ppshkin_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ppshkin:ppshkin@127.0.0.1:55432/ppshkin_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ppshkin-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: ppshkin-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - run: docker compose config --quiet
      - run: docker compose up --detach --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/health
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/ --output /dev/null
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  ci:
    name: ci
    if: always()
    needs: [backend, frontend, docker]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.backend.result }}" = success
      - run: test "${{ needs.frontend.result }}" = success
      - run: test "${{ needs.docker.result }}" = success
