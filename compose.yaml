name: ppshkin

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppshkin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppshkin}
      POSTGRES_DB: ${POSTGRES_DB:-ppshkin}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-ppshkin}:${POSTGRES_PASSWORD:-ppshkin}@db:5432/${POSTGRES_DB:-ppshkin}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
