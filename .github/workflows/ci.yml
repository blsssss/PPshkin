name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: ppshkin
          POSTGRES_PASSWORD: ppshkin
          POSTGRES_DB: ppshkin_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ppshkin -d ppshkin_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ppshkin:ppshkin@127.0.0.1:55432/ppshkin_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ppshkin-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: ppshkin-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - run: docker compose config --quiet
      - run: docker compose up --detach --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/health
      - name: the local demo guest token lists at least six demo venues
        shell: bash
        run: |
          curl --fail --silent -H "Authorization: Bearer local-demo-guest-token-not-secret" "http://127.0.0.1:3000/api/v1/venues?lat=55.7887&lon=49.1221" | jq -e '.items | length >= 6'
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/ --output /dev/null
      - run: curl --fail --silent --show-error http://127.0.0.1:8080/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    env:
      DOMAIN: localhost
      ACME_EMAIL: ci@example.com
      BOT_MODE: "off"
      DEMO_MODE: "true"
      ALERT_BOT_TOKEN: "123456:ci-not-a-real-token"
      ALERT_CHAT_ID: "-100"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet --requirement deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
      - run: ansible-lint
        working-directory: deploy/ansible
      - name: alert rules pass their unit tests
        run: >-
          docker run --rm --entrypoint promtool
          --volume "$PWD/deploy/monitoring:/monitoring:ro" --workdir /monitoring
          prom/prometheus:v3.15.0 test rules rules.test.yml
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ghcr.io/blsssss/ppshkin-backend:sha-good
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: ghcr.io/blsssss/ppshkin-frontend:sha-good
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: a broken release whose backend exits on start
        run: |
          docker create --name broken-backend ghcr.io/blsssss/ppshkin-backend:sha-good
          docker commit --change 'ENTRYPOINT ["false"]' broken-backend ghcr.io/blsssss/ppshkin-backend:sha-broken
          docker rm broken-backend
          docker tag ghcr.io/blsssss/ppshkin-frontend:sha-good ghcr.io/blsssss/ppshkin-frontend:sha-broken
      - name: release secrets
        run: |
          {
            echo "APP_DIR=$RUNNER_TEMP/ppshkin"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "DEMO_GUEST_TOKEN=$(openssl rand -hex 24)"
            echo "DEMO_VENUE_TOKEN=$(openssl rand -hex 24)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - run: >-
          docker run --rm
          --env DOMAIN --env ACME_EMAIL
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Ansible deploys the good release
        run: >-
          ansible-playbook -i localhost, -c local deploy/ansible/site.yml
          -e app_domain=localhost -e app_image_tag=sha-good -e "app_dir=$APP_DIR" -e app_pull_images=false
      - name: https://localhost/health answers 200
        run: |
          status=$(curl -sk --retry 10 --retry-delay 1 --retry-all-errors --output /dev/null --write-out '%{http_code}' https://localhost/health)
          echo "$status"
          test "$status" = 200
      - name: https://localhost/api/v1/me answers 401 with problem+json
        run: |
          result=$(curl -sk --output /dev/null --write-out '%{http_code} %{content_type}' https://localhost/api/v1/me)
          echo "$result"
          grep -Eq '^401 application/problem\+json(;|$)' <<< "$result"
      - name: the demo guest token lists at least six demo venues over HTTPS
        run: |
          curl -sk --fail -H "Authorization: Bearer $DEMO_GUEST_TOKEN" "https://localhost/api/v1/venues?lat=55.7887&lon=49.1221" | jq -e '.items | length >= 6'
      - name: https://localhost/ serves the mini app
        run: |
          page="$RUNNER_TEMP/index.html"
          status=$(curl -sk --output "$page" --write-out '%{http_code}' https://localhost/)
          echo "$status"
          test "$status" = 200
          grep -F 'st.max.ru/js/max-web-app.js' "$page"
      - name: POST https://localhost/max/webhook answers 404
        run: |
          status=$(curl -sk -X POST --output /dev/null --write-out '%{http_code}' https://localhost/max/webhook)
          echo "$status"
          test "$status" = 404
      - name: http://localhost/health redirects to HTTPS
        run: |
          result=$(curl -s --output /dev/null --write-out '%{http_code} %{redirect_url}' http://localhost/health)
          echo "$result"
          test "$result" = '308 https://localhost/health'
      - name: the backend port is not published
        run: |
          code=0
          curl -s --max-time 3 http://127.0.0.1:3000/health || code=$?
          echo "curl exit code $code"
          test "$code" = 7
      - name: the release, the private environment file and the nightly backup are in place
        working-directory: ${{ env.APP_DIR }}
        run: |
          test "$(cat release)" = sha-good
          test "$(stat -c %a .env)" = 600
          crontab -l | grep -F "$APP_DIR/backup.sh"
          ./backup.sh
          test -s "backups/ppshkin-$(date +%F).dump"
      - name: Prometheus and Alertmanager accept the rendered configuration
        working-directory: ${{ env.APP_DIR }}
        run: |
          docker compose -f compose.prod.yaml exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose -f compose.prod.yaml exec -T alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
      - name: Prometheus scrapes every target, including the backend domain metrics
        working-directory: ${{ env.APP_DIR }}
        run: |
          query() { docker compose -f compose.prod.yaml exec -T prometheus wget -qO- "http://localhost:9090/api/v1/query?query=$1"; }
          for attempt in $(seq 1 24); do
            jobs=$(query up | jq -r '[.data.result[] | select(.value[1] == "1") | .metric.job] | sort | join(",")')
            echo "$jobs"
            if [ "$jobs" = "alertmanager,backend,blackbox,node,prometheus" ]; then break; fi
            sleep 5
          done
          test "$jobs" = "alertmanager,backend,blackbox,node,prometheus"
          query ppshkin_active_deals | jq -e '.data.result | length == 1'
          query http_request_duration_seconds_count | jq -e '[.data.result[].metric.route] | index("/ready") != null'
      - name: Grafana serves the provisioned dashboard to anonymous viewers under /grafana
        run: |
          curl -sk --retry 20 --retry-delay 3 --retry-all-errors --fail https://localhost/grafana/api/health | jq -e '.database == "ok"'
          curl -sk --fail https://localhost/grafana/api/dashboards/uid/ppshkin | jq -e '.dashboard.title == "ППшкин" and (.dashboard.panels | length) > 20'
      - name: the metrics endpoint is not published through Caddy
        run: |
          body=$(curl -sk https://localhost/metrics)
          if grep -q process_cpu_seconds_total <<< "$body"; then
            echo "backend metrics are reachable from outside"
            exit 1
          fi
      - name: a broken release fails the playbook
        run: |
          if ansible-playbook -i localhost, -c local deploy/ansible/site.yml -e app_domain=localhost -e app_image_tag=sha-broken -e "app_dir=$APP_DIR" -e app_pull_images=false -e app_wait_timeout=60; then
            echo "the broken release was reported as deployed"
            exit 1
          fi
      - name: the good release serves again after the rollback
        working-directory: ${{ env.APP_DIR }}
        run: |
          test "$(cat release)" = sha-good
          docker compose -f compose.prod.yaml ps --format '{{.Image}}' backend | grep -Fx ghcr.io/blsssss/ppshkin-backend:sha-good
          ls backups/predeploy-*.dump
          status=$(curl -sk --retry 10 --retry-delay 1 --retry-all-errors --output /dev/null --write-out '%{http_code}' https://localhost/ready)
          echo "$status"
          test "$status" = 200
      - if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose -f compose.prod.yaml logs --no-color
      - if: always()
        working-directory: ${{ env.APP_DIR }}
        run: docker compose -f compose.prod.yaml down --volumes

  ci:
    name: ci
    if: always()
    needs: [backend, frontend, docker, deploy]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.backend.result }}" = success
      - run: test "${{ needs.frontend.result }}" = success
      - run: test "${{ needs.docker.result }}" = success
      - run: test "${{ needs.deploy.result }}" = success
