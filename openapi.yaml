      summary: Записать приём пищи по фото
      tags:
        - diary
      description: "Фото передаётся в поле image формы multipart/form-data: JPEG, PNG
        или WebP до 10 МБ, тип определяется по содержимому. Фото не сохраняется
        и уходит в распознавание без данных пользователя. Распознавание платное,
        поэтому не больше 20 запросов в минуту. Уверенно распознанные блюда
        сохраняются сразу, неуверенные возвращаются кандидатами: гость
        подтверждает их через POST /api/v1/diary/meals. При status unavailable
        предложите ручной ввод. Коды ошибок: image_required, image_empty,
        invalid_multipart (400): приложите одно фото в поле image.
        image_too_large, upload_too_many_parts (413): уменьшите фото и отправьте
        только его. multipart_required, unsupported_image_type (415): отправьте
        JPEG, PNG или WebP как multipart/form-data. consent_required (403): нет
        согласия на обработку данных, покажите его текст из GET /api/v1/consents
        и отправьте PUT /api/v1/consents/personal_data. user_not_found (404):
        аккаунт удалён, войдите заново."
