  /api/v1/recommendations:
    get:
      operationId: getRecommendations
      summary: Подобрать блюдо рядом
      tags:
        - recommendations
      description: "Подбирает конкретные блюда в открытых заведениях рядом: они
        укладываются в остаток калорий на сегодня и совпадают со вкусами гостя
        по дневнику за 14 дней. Предложения формируются только по этому запросу,
        в чат ничего не отправляется. Каждый ответ со status ok сохраняет
        показанные предложения, поэтому не больше 30 запросов в минуту. Точка:
        lat и lon из запроса, иначе сохранённое приблизительное местоположение.
        С точкой берутся заведения в радиусе 5 км, без точки все заведения, а
        distanceM равен null. Пустые параметры считаются непереданными. В
        демо-режиме точка дальше 50 км от Казани заменяется центром Казани,
        тогда demoCenterUsed равен true: сообщите гостю, что показаны тестовые
        заведения в центре Казани. Что делать по status: ok - покажите items с
        объяснением (headline, facts, calculations, assumptions), offerId нужен
        для отказа; profile_empty - за 14 дней нет ни одной записи, предложите
        записать первый приём пищи; budget_exhausted - ориентир на сегодня
        набран, сообщите об этом и ничего не предлагайте; nothing_fits -
        подходящих открытых позиций рядом нет, предложите каталог горящих
        предложений GET /api/v1/deals. Коды ошибок: validation_failed (400):
        передайте lat и lon вместе, limit от 1 до 10. consent_required (403):
        нет согласия на обработку данных, покажите его текст из GET
        /api/v1/consents и отправьте PUT /api/v1/consents/personal_data.
        user_not_found (404): аккаунт удалён, войдите заново."
      parameters:
        - schema:
            type: number
            minimum: -90
            maximum: 90
          in: query
          name: lat
          required: false
          description: Широта точки поиска, вместе с lon
        - schema:
            type: number
            minimum: -180
            maximum: 180
          in: query
          name: lon
          required: false
          description: Долгота точки поиска, вместе с lat
        - schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 10
          in: query
          name: limit
          required: false
          description: Сколько блюд подобрать
      security: *a3
      responses:
        "200":
          description: Подобранные блюда
          content:
            application/json:
              schema:
