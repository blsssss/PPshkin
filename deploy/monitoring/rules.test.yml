rule_files:
  - rules.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'up{job="backend",instance="backend:3000"}'
        values: 1 1 0 0 0 0 0 0
    alert_rule_test:
      - eval_time: 1m30s
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m30s
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backend
              instance: backend:3000
            exp_annotations:
              summary: "backend не отвечает Prometheus"
              description: "Цель backend:3000 недоступна больше 2 минут."

  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="backend",route="/api/v1/me",status_code="200"}'
        values: 0+6x20
      - series: 'http_request_duration_seconds_count{job="backend",route="/api/v1/me",status_code="500"}'
        values: 0+3x20
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Ошибки 5xx: 33.33% запросов"
              description: "Backend отвечает ошибками сервера больше 5 минут, смотрите журнал backend."

  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="backend",route="/api/v1/me",status_code="500"}'
        values: 0+1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox",instance="https://hackathon.easymythic.dev/ready"}'
        values: 1 0 0 0 0
    alert_rule_test:
      - eval_time: 4m
        alertname: SiteUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://hackathon.easymythic.dev/ready
            exp_annotations:
              summary: "Сайт недоступен по HTTPS"
              description: "https://hackathon.easymythic.dev/ready не отвечает 200 больше 2 минут: бот, мини-приложение и API недоступны пользователям."

  - interval: 1m
    input_series:
      - series: 'ppshkin_notifications_total{job="backend",kind="venue_booking_created",result="sent"}'
        values: 0+1x40
      - series: 'ppshkin_notifications_total{job="backend",kind="booking_reminder",result="failed"}'
        values: 0+1x40
    alert_rule_test:
      - eval_time: 35m
        alertname: NotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Не доставлено 50% уведомлений"
              description: "За 30 минут больше 10% уведомлений закончились статусом failed или expired: проверьте доступность MAX и журнал backend."

  - interval: 1m
    input_series:
      - series: 'ppshkin_notifications_total{job="backend",kind="booking_reminder",result="expired"}'
        values: 0+0.1x40
      - series: 'ppshkin_notifications_total{job="backend",kind="venue_booking_created",result="sent"}'
        values: 0+0.1x40
    alert_rule_test:
      - eval_time: 35m
        alertname: NotificationsFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ppshkin_notifications_total{job="backend",kind="booking_reminder",result="failed"}'
        values: 0+0.02x40
      - series: 'ppshkin_notifications_total{job="backend",kind="venue_booking_created",result="sent"}'
        values: 0+1x40
    alert_rule_test:
      - eval_time: 35m
        alertname: NotificationsFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'ppshkin_notifications_oldest_pending_seconds{job="backend",instance="backend:3000"}'
        values: 0 0 400+60x14
    alert_rule_test:
      - eval_time: 11m
        alertname: NotificationsBacklog
        exp_alerts: []
      - eval_time: 13m
        alertname: NotificationsBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Уведомление ждёт отправки 17m 40s"
              description: "Готовые к отправке уведомления не уходят больше 5 минут: проверьте, запущен ли бот и задача deliver_notifications."
