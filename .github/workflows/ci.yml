name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ppshkin-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose config --quiet
      - run: docker compose up --detach --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:3000/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  ci:
    name: ci
    if: always()
    needs: [backend, docker]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.backend.result }}" = success
      - run: test "${{ needs.docker.result }}" = success
