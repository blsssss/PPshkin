openapi: 3.1.0
info:
  title: PPshkin API
  version: 1.0.0
  description: HTTP API мини-приложения ППшкин в MAX. Гость ведёт дневник питания
    и получает персональные предложения заведений, заведение управляет меню,
    горящими позициями и бронями.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Сессионный токен из POST /api/v1/auth/max или тестовый токен
        демо-учётки (только при DEMO_MODE=true).
  schemas:
    GeoPointInput:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      required:
        - lat
        - lon
      description: Координаты WGS 84
    ProfilePatchInput:
      type: object
      properties:
        kcalTarget:
          type: integer
          minimum: 1000
          maximum: 5000
          description: Ориентир калорийности на день, ккал
        goal:
          anyOf:
            - type: string
              enum:
                - lose
                - maintain
                - gain
            - type: "null"
          description: "Цель: lose - снизить вес, maintain - удерживать, gain - набрать,
            null - не выбрана"
        dislikedTags:
          maxItems: 20
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
          description: Теги блюд, которые гостю не предлагаются
        timezone:
          description: Часовой пояс IANA, например Europe/Moscow
          type: string
          minLength: 1
          maxLength: 64
      description: "Изменение профиля: передаются только меняющиеся поля, хотя бы одно"
    ManualMealInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название блюда
        kcal:
          type: integer
          minimum: 0
          maximum: 5000
          description: Калорийность одним числом, вместо пары kcalMin и kcalMax
        kcalMin:
          type: integer
          minimum: 0
          maximum: 5000
          description: Нижняя граница калорийности, передаётся вместе с kcalMax
        kcalMax:
          type: integer
          minimum: 0
          maximum: 5000
          description: Верхняя граница калорийности, не меньше kcalMin
        proteinG:
          description: Белки, г
          type: number
          minimum: 0
          maximum: 500
        fatG:
          description: Жиры, г
          type: number
          minimum: 0
          maximum: 500
        carbsG:
          description: Углеводы, г
          type: number
          minimum: 0
          maximum: 500
        tags:
          maxItems: 10
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        eatenAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: "Когда съедено, ISO 8601: не раньше чем 7 дней назад и не позже чем
            через 5 минут от текущего времени"
      required:
        - title
      description: "Приём пищи, введённый вручную. Калорийность: либо kcal, либо пара
        kcalMin и kcalMax. Без eatenAt запись получает текущее время"
    MealPatchInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название блюда
        kcal:
          type: integer
          minimum: 0
          maximum: 5000
          description: Калорийность одним числом, вместо пары kcalMin и kcalMax
        kcalMin:
          type: integer
          minimum: 0
          maximum: 5000
          description: Нижняя граница калорийности, передаётся вместе с kcalMax
        kcalMax:
          type: integer
          minimum: 0
          maximum: 5000
          description: Верхняя граница калорийности, не меньше kcalMin
        proteinG:
          description: Белки, г, null сбрасывает значение
          anyOf:
            - type: number
              minimum: 0
              maximum: 500
            - type: "null"
        fatG:
          description: Жиры, г, null сбрасывает значение
          anyOf:
            - type: number
              minimum: 0
              maximum: 500
            - type: "null"
        carbsG:
          description: Углеводы, г, null сбрасывает значение
          anyOf:
            - type: number
              minimum: 0
              maximum: 500
            - type: "null"
        tags:
          maxItems: 10
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        eatenAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: "Когда съедено, ISO 8601: не раньше чем 7 дней назад и не позже чем
            через 5 минут от текущего времени"
      description: "Изменение приёма пищи: только меняющиеся поля, хотя бы одно.
        Калорийность: либо kcal, либо пара kcalMin и kcalMax"
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Машиночитаемый код ошибки
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
      additionalProperties: false
      description: Описание ошибки по RFC 9457
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
      required:
        - lat
        - lon
      additionalProperties: false
      description: Координаты WGS 84
    ConsentState:
      type: object
      properties:
        granted:
          type: boolean
          description: true, только если действует согласие на актуальную версию текста
        version:
          description: Версия действующего согласия, null если согласия нет. Устаревшая
            версия означает, что согласие нужно дать заново
          type:
            - string
            - "null"
        grantedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
          description: Когда дано действующее согласие
      required:
        - granted
        - version
        - grantedAt
      additionalProperties: false
      description: Состояние согласия пользователя
    ConsentStatus:
      type: object
      properties:
        personalData:
          $ref: "#/components/schemas/ConsentState"
        personalizedOffers:
          $ref: "#/components/schemas/ConsentState"
      required:
        - personalData
        - personalizedOffers
      additionalProperties: false
      description: Состояние обоих согласий пользователя
    ConsentDocument:
      type: object
      properties:
        kind:
          type: string
          enum:
            - personal_data
            - personalized_offers
          description: personal_data - обработка персональных данных, personalized_offers
            - персональные предложения
        version:
          type: string
          description: Актуальная версия текста, её передают в PUT /api/v1/consents/{kind}
        title:
          type: string
        text:
          type: string
          description: Полный текст согласия, абзацы разделены пустой строкой
        required:
          type: boolean
          description: Без обязательного согласия дневник и профиль не сохраняются
        granted:
          type: boolean
          description: Действует ли согласие пользователя на актуальную версию
        grantedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
          description: Когда дано действующее согласие
      required:
        - kind
        - version
        - title
        - text
        - required
        - granted
        - grantedAt
      additionalProperties: false
      description: Текст согласия и его состояние у пользователя
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор пользователя в MAX
        firstName:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        timezone:
          type: string
          description: Часовой пояс IANA, по нему считаются дни дневника
        kcalTarget:
          type: integer
          description: Ориентир калорийности на день, ккал
        goal:
          anyOf:
            - type: string
              enum:
                - lose
                - maintain
                - gain
            - type: "null"
          description: "Цель: lose - снизить вес, maintain - удерживать, gain - набрать,
            null - не выбрана"
        dislikedTags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
          description: Теги блюд, которые гостю не предлагаются
        location:
          anyOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
          description: Последнее переданное местоположение с точностью около 1 км
        locationUpdatedAt:
          anyOf:
            - type: string
              format: date-time
              examples:
                - 2026-09-25T12:00:00.000Z
              description: Дата и время в формате ISO 8601, UTC
            - type: "null"
          description: Когда передано местоположение
        consents:
          $ref: "#/components/schemas/ConsentStatus"
      required:
        - id
        - firstName
        - username
        - timezone
        - kcalTarget
        - goal
        - dislikedTags
        - location
        - locationUpdatedAt
        - consents
      additionalProperties: false
      description: Профиль пользователя и состояние его согласий
    UserLocation:
      type: object
      properties:
        location:
          $ref: "#/components/schemas/GeoPoint"
        updatedAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
      required:
        - location
        - updatedAt
      additionalProperties: false
      description: "Сохранённое местоположение: координаты округлены до 2 знаков, это
        около 1 км"
    Session:
      type: object
      properties:
        token:
          type: string
          description: "Токен для заголовка Authorization: Bearer"
        expiresAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
        startParam:
          description: Подписанный параметр startapp, с которым открыто мини-приложение
          type:
            - string
            - "null"
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - expiresAt
        - startParam
        - user
      additionalProperties: false
    Meal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        kcalMin:
          type: integer
        kcalMax:
          type: integer
        kcal:
          type: integer
          description: Середина диапазона, по ней считаются итоги дня
        proteinG:
          description: Белки, г
          type:
            - number
            - "null"
        fatG:
          description: Жиры, г
          type:
            - number
            - "null"
        carbsG:
          description: Углеводы, г
          type:
            - number
            - "null"
        tags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        source:
          type: string
          enum:
            - photo
            - text
            - manual
            - booking
            - demo
          description: photo и text - распознано, manual - введено вручную, booking -
            погашенная бронь, demo - демо-данные
        confidence:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
          description: Уверенность распознавания от 0 до 1, null для остальных записей
        eatenAt:
          type: string
          format: date-time
          examples:
            - 2026-09-25T12:00:00.000Z
          description: Дата и время в формате ISO 8601, UTC
        slot:
          type: string
          enum:
            - breakfast
            - lunch
            - snack
            - dinner
          description: Приём пищи по местному времени пользователя
      required:
        - id
        - title
        - kcalMin
        - kcalMax
        - kcal
        - proteinG
        - fatG
        - carbsG
        - tags
        - source
        - confidence
        - eatenAt
        - slot
      additionalProperties: false
      description: Запись дневника питания. Калорийность приблизительная
    DayTotals:
      type: object
      properties:
        meals:
          type: integer
          description: Количество записей
        kcalMin:
          type: integer
        kcalMax:
          type: integer
        kcal:
          type: integer
          description: Сумма середин диапазонов
        proteinG:
          type: number
        fatG:
          type: number
        carbsG:
          type: number
      required:
        - meals
        - kcalMin
        - kcalMax
        - kcal
        - proteinG
        - fatG
        - carbsG
      additionalProperties: false
      description: Итоги дня
    DiaryDay:
      type: object
      properties:
        date:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          description: Календарная дата YYYY-MM-DD в часовом поясе пользователя
        timezone:
          type: string
          description: Часовой пояс, в котором считаются границы дня
        targetKcal:
          type: integer
          description: Ориентир калорийности пользователя
        totals:
          $ref: "#/components/schemas/DayTotals"
        remainingKcal:
          type: integer
          minimum: 0
          description: Сколько осталось до ориентира, не меньше 0
        meals:
          type: array
          items:
            $ref: "#/components/schemas/Meal"
          description: Записи дня по возрастанию eatenAt
      required:
        - date
        - timezone
        - targetKcal
        - totals
        - remainingKcal
        - meals
      additionalProperties: false
      description: Дневник за один день
    DiarySummaryDay:
      type: object
      properties:
        date:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          description: Календарная дата YYYY-MM-DD в часовом поясе пользователя
        meals:
          type: integer
        kcal:
          type: integer
        kcalMin:
          type: integer
        kcalMax:
          type: integer
        proteinG:
          type: number
        fatG:
          type: number
        carbsG:
          type: number
      required:
        - date
        - meals
        - kcal
        - kcalMin
        - kcalMax
        - proteinG
        - fatG
        - carbsG
      additionalProperties: false
      description: Итоги одного дня, дни без записей с нулями
    DiarySummary:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/DiarySummaryDay"
          description: Дни от старых к новым, последний - сегодня
      required:
        - days
      additionalProperties: false
      description: Итоги по дням
    MealCandidate:
      type: object
      properties:
        title:
          type: string
        portionG:
          description: Оценка порции, г
          type:
            - number
            - "null"
        kcalMin:
          type: integer
        kcalMax:
          type: integer
        proteinG:
          type: number
        fatG:
          type: number
        carbsG:
          type: number
        tags:
          type: array
          items:
            type: string
            enum:
              - sweet
              - dessert
              - pastry
              - chocolate
              - fruit
              - berries
              - dairy
              - cheese
              - eggs
              - meat
              - poultry
              - fish
              - seafood
              - vegetarian
              - vegetables
              - greens
              - salad
              - soup
              - grain
              - pasta
              - rice
              - potato
              - bread
              - fried
              - grilled
              - spicy
              - fast_food
              - coffee
              - tea
              - drink
              - juice
              - high_protein
              - light
              - hearty
              - breakfast
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
        - title
        - portionG
        - kcalMin
        - kcalMax
        - proteinG
        - fatG
        - carbsG
        - tags
        - confidence
      additionalProperties: false
      description: Вариант распознавания, который гость может подтвердить
    MealLogResult:
      oneOf:
        - type: object
          properties:
            status:
              type: string
              const: logged
            meals:
              type: array
              items:
                $ref: "#/components/schemas/Meal"
              description: Сохранённые записи
            basis:
              type: string
              description: Короткое пояснение распознавания для гостя
            day:
              $ref: "#/components/schemas/DiaryDay"
          required:
            - status
            - meals
            - basis
            - day
          additionalProperties: false
        - type: object
          properties:
            status:
              type: string
              const: uncertain
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/MealCandidate"
            basis:
              type: string
              description: Короткое пояснение распознавания для гостя
          required:
            - status
            - candidates
            - basis
          additionalProperties: false
        - type: object
          properties:
            status:
              type: string
              const: not_food
            basis:
              type: string
              description: Короткое пояснение распознавания для гостя
          required:
            - status
            - basis
          additionalProperties: false
        - type: object
          properties:
            status:
              type: string
              const: unavailable
            reason:
              type: string
              enum:
                - disabled
                - timeout
                - provider_error
                - invalid_response
                - quota_exceeded
                - unsupported_image
          required:
            - status
            - reason
          additionalProperties: false
      description: "Результат распознавания по полю status. logged: уверенно
        распознанные блюда сохранены, day - обновлённый дневник за сегодня.
        uncertain: ничего не сохранено, гость выбирает вариант или вводит блюдо,
        запись создаётся через POST /api/v1/diary/meals. not_food: на фото или в
        тексте нет еды, ничего не сохранено. unavailable: распознавание
        недоступно, предложите ручной ввод; reason unsupported_image - фото не
        удалось прочитать, попросите JPEG или PNG."
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка, что процесс жив
      tags:
        - system
      responses:
        "200":
          description: Процесс работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
                additionalProperties: false
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /ready:
    get:
      operationId: getReadiness
      summary: Готовность к работе, проверяет базу данных
      tags:
        - system
      responses:
        "200":
          description: Сервис готов
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                required:
                  - status
                additionalProperties: false
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: &a1
            Retry-After:
              description: Через сколько секунд можно повторить запрос
              schema:
                type: integer
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/max:
    post:
      operationId: signInWithMax
      summary: Вход по initData мини-приложения MAX
      tags:
        - auth
      description: "Проверяет подпись initData по алгоритму MAX (HMAC-SHA256 с ключом
        WebAppData и токеном бота) и срок давности, создаёт пользователя при
        первом входе и выдаёт сессионный токен. Коды ошибок:
        init_data_malformed, init_data_bad_signature, init_data_no_user (401,
        отправьте initData без изменений), init_data_expired (401, переоткройте
        мини-приложение), auth_unavailable (503, вход через MAX не настроен на
        сервере). Токен из ответа передаётся в заголовке Authorization: Bearer.
        Ответ 401 с кодом invalid_token на других методах означает, что сессия
        истекла и нужно войти заново. В user.consents состояние согласий: если
        personalData.granted равно false, покажите экраны согласий до работы с
        дневником."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initData:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: Строка window.WebApp.initData из MAX Bridge без изменений
              required:
                - initData
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: &a2
            WWW-Authenticate:
              description: Схема аутентификации Bearer
              schema:
                type: string
        "413":
          description: Payload Too Large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Профиль текущего пользователя
      tags:
