          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/venue/analytics:
    get:
      operationId: getVenueAnalytics
      summary: Аналитика заведения
      tags:
        - venue
      description: "Итоги за период from - to включительно по часовому поясу
        заведения, по умолчанию последние 7 дней включая сегодня. Сколько
        предложений заведения показано гостям и принято, сколько броней создано,
        погашено, истекло и отменено, выручка и проданные горящие порции, лучшие
        позиции и показатели по дням. Брони, время которых вышло, перед
        подсчётом переводятся в expired. Коды ошибок: validation_failed (400):
        передайте from и to в формате YYYY-MM-DD. invalid_period (400): from
        позже to или период длиннее 92 дней. venue_not_found (404): заведения
        ещё нет, предложите создать его через POST /api/v1/venue."
      parameters:
        - schema:
            format: date
            type: string
          example: 2026-09-25
          in: query
          name: from
          required: false
          description: Первый день периода YYYY-MM-DD по часовому поясу заведения, по
            умолчанию 6 дней до to
        - schema:
            format: date
            type: string
          example: 2026-09-25
          in: query
          name: to
          required: false
          description: Последний день периода включительно, по умолчанию сегодня
      security: *a3
      responses:
        "200":
          description: Аналитика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueAnalytics"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/venue/demo:
    post:
      operationId: claimDemoVenue
      summary: Взять демо-заведение
      tags:
        - venue
      description: "Только в демо-режиме. Создаёт личную копию тестового заведения:
        название, адрес, часы работы, доступное меню и горящие предложения на
        оставшуюся часть сегодняшнего дня. Владельцем становится текущий
        пользователь. Копию видит только он, в каталоге и подборе она заменяет
        исходное заведение. Дальше копией управляют как своим заведением через
        /api/v1/venue, в следующие дни она не обновляется. Без sourceVenueId
        копируется кофейня «Зерно», тело тогда пустой объект {}. Коды ошибок:
        validation_failed (400): sourceVenueId должен быть положительным целым
        числом. demo_account (403): общие демо-учётки не могут взять копию,
        войдите через MAX. demo_mode_disabled (404): демо-режим на сервере
        выключен, скройте эту кнопку. venue_not_found (404): sourceVenueId не
        тестовое заведение из демо-набора, не передавайте его. venue_exists
        (409): у пользователя уже есть заведение, откройте его через GET
        /api/v1/venue."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceVenueId:
                  default: 900001
                  description: Засеянное демо-заведение, копию которого получит пользователь; по
                    умолчанию кофейня «Зерно»
                  type: integer
                  exclusiveMinimum: 0
      security: *a3
      responses:
        "201":
          description: Копия демо-заведения создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "403":
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Payload Too Large
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported Media Type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a1
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/diary/demo:
    post:
      operationId: fillDemoDiary
      summary: Заполнить дневник примером
      tags:
        - diary
      description: "Только в демо-режиме. Добавляет пример дневника за 5 прошлых дней:
        26 приёмов пищи с source demo по местному времени пользователя. После
        этого профиль пищевого поведения готов и подбор учитывает привычки,
        например десерт около 16:00. Ориентир, цель и нелюбимые теги не
        меняются. Приёмы примера удаляются как обычные записи через DELETE
        /api/v1/diary/meals/{id} или вместе с аккаунтом. Коды ошибок:
        demo_account (403): у общей демо-учётки дневник уже заполнен.
        consent_required (403): нет согласия на обработку данных, покажите его
        текст из GET /api/v1/consents и отправьте PUT
        /api/v1/consents/personal_data. demo_mode_disabled (404): демо-режим на
        сервере выключен, скройте эту кнопку. user_not_found (404): аккаунт
        удалён, войдите заново. demo_diary_exists (409): пример уже добавлен,
        откройте дневник."
      security: *a3
      responses:
        "201":
          description: Пример дневника добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDiaryResult"
        "401":
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          headers: *a2
        "403":
          description: Forbidden
          content:
